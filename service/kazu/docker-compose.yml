name: kazu

services:
  kazu:
    image: kazu
    pull_policy: never # image is build locally.
    container_name: kazu
    restart: unless-stopped
    command: [metrics, --host=0.0.0.0]
    networks:
      - metrics
    volumes:
      - kazu_config:/root/.config/kazu
      - kazu_parallel_auth:/root/.config/parallel-web-tools
      - /etc/localtime:/etc/localtime:ro

networks:
  metrics:
    external: true

volumes:
  kazu_config:
    external: true
  kazu_parallel_auth:
    external: true
