services:
  cli-proxy-api:
    container_name: cli-proxy-api
    image: eceasy/cli-proxy-api
    restart: unless-stopped
    labels:
      service_repository: https://github.com/router-for-me/CLIProxyAPI
    command: ["/CLIProxyAPI/CLIProxyAPI", "--config", "/config/config.yaml"]
    networks:
      - docker
    volumes:
      - cli-proxy-api-config:/config
      - cli-proxy-api-auth:/root/.cli-proxy-api
      - cli-proxy-api-plugins:/CLIProxyAPI/plugins

  cpa-usage-keeper:
    container_name: cpa-usage-keeper
    image: ghcr.io/willxup/cpa-usage-keeper
    restart: unless-stopped
    labels:
      service_repository: https://github.com/Willxup/cpa-usage-keeper
    environment:
      CPA_BASE_URL: http://cli-proxy-api:8317
      CPA_MANAGEMENT_KEY: ${MANAGEMENT_KEY:?Set MANAGEMENT_KEY in .env}
      LOGIN_PASSWORD: ${KEEPER_LOGIN_PASSWORD:?Set KEEPER_LOGIN_PASSWORD in .env}
      CPA_PUBLIC_URL: https://cli-proxy-api.home.kokomi.site
    networks:
      - docker
    volumes:
      - cpa-usage-keeper-data:/data
      - /etc/localtime:/etc/localtime:ro

networks:
  docker:
    external: true

volumes:
  cli-proxy-api-config:
    name: cli-proxy-api-config
    external: true
  cli-proxy-api-auth:
    name: cli-proxy-api-auth
    external: true
  cli-proxy-api-plugins:
    name: cli-proxy-api-plugins
    external: true
  cpa-usage-keeper-data:
    name: cpa-usage-keeper-data
    external: true
