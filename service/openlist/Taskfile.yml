version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull docker.sparkcr.cn/openlistteam/openlist
      - docker tag docker.sparkcr.cn/openlistteam/openlist openlistteam/openlist
      - docker compose up -d --pull never

  open:
    desc: Open OpenList homepage in browser
    vars:
      URL: http://openlist.docker:5244
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
