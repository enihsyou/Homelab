services:
  openlist:
    container_name: openlist
    image: openlistteam/openlist:latest
    restart: unless-stopped
    labels:
      service_repository: https://github.com/OpenListTeam/OpenList
    networks:
      - docker
    volumes:
      # If error with 'database is locked' on first start, see https://obsidian.kokomi.me/Diary/2025-12-04
      - /opt/data/openlist:/opt/openlist/data
      - /opt/data/pichost:/opt/pichost
    environment:
      TZ: Asia/Shanghai
    user: 0:0

networks:
  docker:
    external: true
