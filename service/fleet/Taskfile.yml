version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull docker.sparkcr.cn/library/mysql:8.4
      - docker tag docker.sparkcr.cn/library/mysql:8.4 mysql:8.4
      - docker pull docker.sparkcr.cn/library/redis:7
      - docker tag docker.sparkcr.cn/library/redis:7 redis:7
      - docker pull docker.sparkcr.cn/fleetdm/fleet
      - docker tag docker.sparkcr.cn/fleetdm/fleet fleetdm/fleet
      - docker compose up -d --pull never

  open:
    desc: Open Fleet homepage in browser
    vars:
      URL: https://fleet.home.kokomi.site
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]

  up:
    desc: Start Fleet and its dependencies
    cmds:
      - docker volume create fleet_mysql
      - docker volume create fleet_redis
      - docker compose up -d

  down:
    desc: Stop Fleet while preserving its data
    cmds:
      - docker compose down

  logs:
    cmds:
      - docker compose logs --tail=100 -f fleet
