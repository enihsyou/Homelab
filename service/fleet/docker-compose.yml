services:
  mysql:
    image: mysql:8.4
    labels:
      service_repository: https://github.com/mysql/mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - fleet_mysql:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 24h
      start_period: 10m
      start_interval: 5s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  redis:
    image: redis:7
    labels:
      service_repository: https://github.com/redis/redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fleet_redis:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 24h
      start_period: 10m
      start_interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  fleet:
    image: fleetdm/fleet
    container_name: fleet
    labels:
      service_repository: https://github.com/fleetdm/fleet
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "/usr/bin/fleet prepare db --no-prompt && /usr/bin/fleet serve"
    environment:
      FLEET_MYSQL_ADDRESS: mysql:3306
      FLEET_MYSQL_DATABASE: fleet
      FLEET_MYSQL_USERNAME: fleet
      FLEET_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      FLEET_REDIS_ADDRESS: redis:6379
      FLEET_SERVER_ADDRESS: 0.0.0.0:8080
      FLEET_SERVER_TLS: "false"
      FLEET_SERVER_PRIVATE_KEY: ${FLEET_SERVER_PRIVATE_KEY:?required}
    networks:
      - default
      - docker
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

networks:
  docker:
    external: true

volumes:
  fleet_mysql:
    external: true
  fleet_redis:
    external: true
