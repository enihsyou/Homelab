version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull docker.sparkcr.cn/caronc/apprise
      - docker tag docker.sparkcr.cn/caronc/apprise caronc/apprise
      - docker compose up -d --pull never

  open:
    desc: Open Apprise homepage in browser
    vars:
      URL: http://apprise.docker:8000
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
