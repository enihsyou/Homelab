version: "3"

vars:
  CONTAINER: caddy

tasks:
  reload:
    desc: Sync Caddyfile.d to caddy:/etc/caddy/Caddyfile.d + reload caddy
    summary: |
      Copy Caddyfile.d directly into the container via the Docker API,
      then trigger a Caddy reload. The running caddy container mounts
      /etc/caddy/Caddyfile.d from the caddy_data volume, so changes are
      picked up by the import glob without a rebuild or downtime.
      `docker cp` overlays files but does not prune orphans; remove
      stale .caddyfile entries from the source tree before uploading.
    cmds:
      - docker cp Caddyfile.d {{.CONTAINER}}:/etc/caddy/
      - docker exec -w /etc/caddy {{.CONTAINER}} caddy reload

  logs:
    desc: Follow recent Caddy container logs
    cmds:
      - docker logs --follow --since 30s {{.CONTAINER}} 2>&1 | bat --language=log -pp

  logging:
    desc: Show the last 20 lines of the caddy container log
    cmds:
      - docker logs --tail=20 {{.CONTAINER}}
      - docker exec {{.CONTAINER}} tail -n 20 /run/caddy/caddy.log
