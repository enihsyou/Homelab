version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull ghcr.sparkcr.cn/hywax/mafl
      - docker tag ghcr.sparkcr.cn/hywax/mafl ghcr.linkos.org/hywax/mafl
      - docker compose up -d --pull never --build

  open:
    desc: Open Mafl homepage in browser
    vars:
      URL: http://mafl.docker:3000
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
