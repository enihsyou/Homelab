version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull docker.sparkcr.cn/portainer/portainer-ce:lts
      - docker tag docker.sparkcr.cn/portainer/portainer-ce:lts portainer/portainer-ce:lts
      - docker compose up -d --pull never

  open:
    desc: Open Portainer homepage in browser
    vars:
      URL: https://portainer.docker
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
