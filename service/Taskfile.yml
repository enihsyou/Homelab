version: "3"

tasks:
  recreate:*:
    vars:
      SERVICE: "{{index .MATCH 0}}"
    dir: "{{.SERVICE}}"
    cmds:
      - docker compose up --detach --build --remove-orphans

  upgrade:*:
    vars:
      SERVICE: "{{index .MATCH 0}}"
    dir: "{{.SERVICE}}"
    cmds:
      - docker compose pull
      - docker compose up --detach --build --remove-orphans

  new_cert:
    summary: |
      Generate new certificate with certbot.
      task new_cert -- domain_a,domain_b
    cmds:
      - certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/private/certbot/cloudflare.ini -d {{.CLI_ARGS}}

  network:create:
    status:
      - docker network inspect docker
    cmds:
      - docker network create -d macvlan --ipv6 -o parent=ens18
        --subnet=192.168.9.0/24 --gateway=192.168.9.1 --ip-range=192.168.9.224/27
        docker
