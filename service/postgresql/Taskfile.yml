version: "3"

vars:
  NAME: postgresql
  VOLUME: "{{.NAME}}_data"

includes:
  root:
    taskfile: ../Taskfile.yml
    internal: true

tasks:
  init-volume:
    desc: Initialize the PostgreSQL data directory with a temporary container
    cmds:
      - |
        ssh docker /bin/sh -e << 'EOF'
        printf '\n==> Creating Docker volume {{.VOLUME}}\n'
        docker volume create {{.VOLUME}}

        if docker run --rm -v {{.VOLUME}}:/var/lib/postgresql alpine test -f /var/lib/postgresql/18/docker/PG_VERSION; then
          printf '\n==> PostgreSQL volume is already initialized\n'
          exit 0
        fi

        printf '\n==> Generating a temporary PostgreSQL password\n'
        password="$(openssl rand -base64 36 | tr -d '\r\n')"
        printf 'PostgreSQL password: %s\n' "$password"

        printf '\n==> Starting temporary PostgreSQL container\n'
        docker run --rm --detach \
          --name {{.NAME}}-init \
          --env POSTGRES_PASSWORD="$password" \
          --env TZ=Asia/Shanghai \
          --volume {{.VOLUME}}:/var/lib/postgresql \
          postgres:18

        printf '\n==> Waiting for PostgreSQL initialization\n'
        until docker exec {{.NAME}}-init pg_isready -U postgres; do
          sleep 1
        done

        docker logs {{.NAME}}-init
        docker stop {{.NAME}}-init
        unset password
        printf '\n==> PostgreSQL volume initialized\n'
        EOF

  certificate:
    desc: Obtain the PostgreSQL TLS certificate in the named volume
    cmds:
      - task: root:certificate
        vars:
          CONTAINER: "{{.NAME}}"
