scrape_configs:
  - job_name: mihomo
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - mihomo-exporter:9109
        labels:
          service_name: mihomo-exporter
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: mihomo_rules.*
        action: drop
      - source_labels: [__name__]
        regex: mihomo_proxies.*
        action: drop
      - source_labels: [__name__]
        regex: mihomo_memory.*
        action: drop
      # Mark the one exporter metric that must remain before dropping the
      # rest of the mihomo_exporter* family. Prometheus uses RE2, which has
      # no negative lookahead for expressing this as one regex.
      - source_labels: [__name__]
        regex: mihomo_exporter_scrape_duration_seconds
        target_label: __tmp_mihomo_exporter_keep
        replacement: "1"
        action: replace
      - source_labels: [__name__, __tmp_mihomo_exporter_keep]
        regex: mihomo_exporter.*;
        action: drop
      - regex: __tmp_mihomo_exporter_keep
        action: labeldrop
