version: "3"

vars:
  NAME: prometheus
  # Mirrors docker-compose.yml's container_name so reload targets the
  # right container without parsing compose.
  CONTAINER: prometheus

tasks:
  certificate:
    desc: Issue and upload the Prometheus TLS certificate
    cmds:
      - mkdir -p certs
      - defer: rm -rf certs
      - step ca certificate prometheus.docker certs/cert.pem certs/key.pem --force
      - step ca root certs/ca.pem --force
      - docker cp certs {{.CONTAINER}}:/etc/prometheus
      - docker exec --user 0 {{.CONTAINER}} sh -c 'chown -R 65534:65534 /etc/prometheus/certs && chmod 600 /etc/prometheus/certs/key.pem'
      - task: reload

  open:
    desc: Open Prometheus homepage in browser
    vars:
      URL: https://prometheus.docker:443
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]

  reload:
    desc: Reload Prometheus configuration
    cmds:
      - docker cp prometheus.yml {{.CONTAINER}}:/etc/prometheus
      - docker cp web.yml {{.CONTAINER}}:/etc/prometheus
      - docker cp scrapes {{.CONTAINER}}:/etc/prometheus
      - docker cp rules {{.CONTAINER}}:/etc/prometheus
      - docker compose kill --signal HUP

  logs:
    desc: Follow recent Prometheus logs
    cmds:
      - docker logs --follow --since 30s {{.CONTAINER}} 2>&1 | bat --language=log -pp
