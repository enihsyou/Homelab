version: "3"

tasks:
  open:
    desc: Open InfluxDB Explorer homepage in browser
    vars:
      URL: http://influxdb-explorer.docker:8080
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
