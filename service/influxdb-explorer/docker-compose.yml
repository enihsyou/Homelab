services:
  influxdb-explorer:
    container_name: influxdb-explorer
    image: influxdata/influxdb3-ui:latest
    restart: unless-stopped
    networks:
      - docker
    volumes:
      - db:/db
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["--mode=admin"]

networks:
  docker:
    external: true

volumes:
  db:
