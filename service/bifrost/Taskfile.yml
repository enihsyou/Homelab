version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull docker.sparkcr.cn/maximhq/bifrost
      - docker tag docker.sparkcr.cn/maximhq/bifrost maximhq/bifrost
      - docker compose up -d --pull never

  open:
    desc: Open Bifrost homepage in browser
    vars:
      URL: http://bifrost.docker:8080
    cmds:
      - cmd: cmd /c start "" "{{.URL}}"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
