services:
  bifrost:
    container_name: bifrost
    image: maximhq/bifrost:latest
    networks:
      - docker
    volumes:
      - bifrost_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      LOG_STYLE: pretty

volumes:
  bifrost_data:
    name: bifrost_data
    external: true

networks:
  docker:
    external: true
