services:
  mcp-gateway:
    container_name: mcp-gateway
    image: docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688
    restart: unless-stopped
    labels:
      service_repository: https://github.com/docker/mcp-gateway
    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN:?set it in .env}
    command:
      - --catalog=/root/.docker/mcp/catalogs/shared.yaml
      - --tools-config=/root/.docker/mcp/tools.yaml
      - --secrets=/root/.docker/mcp/secrets/.env
      - --servers=exa,firecrawl,grafana,minimax,parallel,tavily,tinyfish
      - --transport=streaming
      - --port=8811
      - --log-calls=false
      - --verbose=false
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - mcp-gateway-config:/root/.docker/mcp
      - mcp-gateway-secrets:/root/.docker/mcp/secrets
    networks:
      - docker

networks:
  docker:
    external: true

volumes:
  mcp-gateway-config:
  mcp-gateway-secrets:
    external: true
    name: mcp-gateway-secrets
