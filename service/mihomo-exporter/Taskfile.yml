version: "3"

tasks:
  pull:
    desc: Pull images and update containers
    cmds:
      - docker pull ghcr.sparkcr.cn/suselz/mihomo-exporter
      - docker tag ghcr.sparkcr.cn/suselz/mihomo-exporter ghcr.io/suselz/mihomo-exporter
      - docker compose up -d --pull never

  up:
    desc: Create the shared metrics network and start the Mihomo exporter
    cmds:
      - task --taskfile ../Taskfile.yml network:metrics:create
      - docker compose up -d

  down:
    desc: Remove the Mihomo exporter while preserving the shared metrics network
    cmds:
      - docker compose down

  logs:
    desc: Follow recent Mihomo exporter logs
    cmds:
      - docker compose logs --follow --since 30s
