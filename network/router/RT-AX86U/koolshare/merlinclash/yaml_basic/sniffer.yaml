sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:   
      ports: [80, 8080-8880]
      override-destination: false
  force-domain:
    - '+.v2ex.com'
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.apple.com'
    - dl-cdn.alpinelinux.org
    - deb.debian.org
    - security.debian.org
    - archive.ubuntu.com
    - mirror.init7.net
    - ftp.halifax.rwth-aachen.de
    - mirrors.edge.kernel.org
    - alpine.mirror.wearetriple.com
    - mirror.leaseweb.com
    - uk.alpinelinux.org
    - dl-2.alpinelinux.org
    - dl-4.alpinelinux.org
